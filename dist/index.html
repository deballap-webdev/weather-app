<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main class="fade-in">
      <h1 class="offscreen">
        Responsive Weather App Powered By Open Weather A P I
      </h1>
      <section class="searchBar fade-in" id="searchBar">
        <form class="searchBar__form" id="searchBar__form" role="search">
          <label for="searchBar__text" class="offscreen"
            >Enter a new location</label
          >
          <input
            type="text"
            id="searchBar__text"
            class="searchBar__text"
            placeholder="City, State, Country"
            autocomplete="off"
            role="searchbox"
          />
          <button
            type="submit"
            title="Submit Location"
            aria-label="Enter Zip Code or City, State, and Contry to retrieve weather conditions"
            class="searchBar__button button"
            id="searchBar__button"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-rotate fa-spin none"></i>
          </button>
        </form>
      </section>
      <a href="#currentForecast" class="skip-link"
        >Skip to Current Conditions</a
      >
      <section
        class="currentForecast fade-in"
        id="currentForecast"
        role="region"
        aria-labelledby="currentForecast__location"
      >
        <h2 id="currentForecast__location" class="currentForecast__location">
          Current Location
        </h2>
        <div
          id="currentForecast__condition"
          class="currentForecast__condition"
        ></div>
      </section>

      <a href="#currentForecast" class="skip-link">Skip to Daily Forecast</a>
      <nav class="navButtons fade-in" id="navButtons">
        <button
          id="getLocation"
          class="button"
          title="Get Location"
          aria-label="Get the current weather conditions for your currnt location"
        >
          <i class="fa-solid fa-location-dot"></i>
          <i class="fa-solid fa-rotate fa-spin none"></i>
        </button>
        <button
          id="home"
          class="button"
          title="Home weather"
          aria-label="Get the current weather conditions for your home location"
        >
          <i class="fa-solid fa-house-chimney"></i>
          <i class="fa-solid fa-rotate fa-spin none"></i>
        </button>
        <button
          id="saveLocation"
          class="button"
          title="Save Location"
          aria-label="Save the current location as your home location"
        >
          <i class="fa-solid fa-floppy-disk"></i>
          <i class="fa-solid fa-rotate fa-spin none"></i>
        </button>
        <button
          id="unit"
          class="button"
          title="Toogle Measurement Units"
          aria-label="Tooge between metric and imperial measuremnt units"
        >
          <i class="fa-solid fa-chart-column"></i>
          <i class="fa-solid fa-rotate fa-spin none"></i>
        </button>

        <button
          id="refresh"
          class="button"
          title="Refresh Weather"
          aria-label="Refresh the currrent weather conditions"
        >
          <i class="fa-solid fa-rotate refresh"></i>
          <i class="fa-solid fa-rotate fa-spin none"></i>
        </button>
      </nav>
      <hr class="fade-in" />
      <section
        class="dailyForecast fade-in"
        id="dailyForecast"
        role="region"
        aria-labelledby="dailyForecast__title"
      >
        <h2 id="dailyForecast__title" class="dailyForecast__title offscreen">
          Six Day Forecast
        </h2>
        <div id="dailyForecast__contents" class="dailyForecast__contents"></div>
      </section>
      <p id="confirmation" class="offscreen" aria-live="assertive"></p>
    </main>
  </body>
</html>
